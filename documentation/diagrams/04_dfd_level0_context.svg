xt><text x="565" y="122" text-anchor="middle" font-size="10.5" class="t-reg" fill="#1e293b">Request &amp; Circulation Logs</text><path d="M 290 245 C 260 265, 260 310, 315 350" fill="none" stroke="#334155" stroke-width="1.7" marker-end="url(#arr)"/><text x="155" y="298" text-anchor="middle" font-size="10.5" class="t-reg" fill="#1e293b">Search results, Request status,</text><text x="155" y="312" text-anchor="middle" font-size="10.5" class="t-reg" fill="#1e293b">Borrowed books &amp; history</text><path d="M 405 350 C 460 310, 460 265, 430 245" fill="none" stroke="#334155" stroke-width="1.7" marker-end="url(#arr)"/><text x="565" y="298" text-anchor="middle" font-size="10.5" class="t-reg" fill="#1e293b">Registration, Login details,</text><text x="565" y="312" text-anchor="middle" font-size="10.5" class="t-reg" fill="#1e293b">Search keywords, Book requests</text></svg>