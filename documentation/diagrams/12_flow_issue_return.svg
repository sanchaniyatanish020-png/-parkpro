<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 490" width="100%" style="max-width:680px;height:auto;display:block;margin:0 auto;">
<defs>
  <style>
    .t-title { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; fill: #0f172a; }
    .t-sub { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 400; fill: #475569; }
    .t-bold { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; }
    .t-reg { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 500; }
    .t-mono { font-family: 'Consolas', 'Courier New', monospace; }
  </style>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155"/>
  </marker>
  <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1d4ed8"/>
  </marker>
  <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#15803d"/>
  </marker>
  <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#b91c1c"/>
  </marker>
  <filter id="sh" x="-5%" y="-5%" width="112%" height="115%">
    <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.08"/>
  </filter>
</defs>
<rect x="182.5" y="11.0" width="175" height="34" rx="17.0" ry="17.0" fill="#0f172a" stroke="#0f172a" stroke-width="1.8" filter="url(#sh)"/><text x="270" y="32.5" text-anchor="middle" font-size="12.5" class="t-bold" fill="#ffffff">Start (Approved)</text><path d="M 270 45 L 270 68" fill="none" stroke="#334155" stroke-width="1.7" marker-end="url(#arr)"/><polygon points="270,70.0 365.0,102 270,134.0 175.0,102" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" filter="url(#sh)"/><text x="270" y="106.0" text-anchor="middle" font-size="11.5" class="t-bold" fill="#78350f">AvailableQty &gt; 0?</text><path d="M 365 102 L 460 102" fill="none" stroke="#b91c1c" stroke-width="1.7" marker-end="url(#arr-red)"/><rect x="398.0" y="83" width="24" height="16" rx="3" fill="#ffffff"/><text x="410" y="95" text-anchor="middle" font-size="10.5" class="t-bold" fill="#b91c1c">No</text><rect x="462.5" y="80.0" width="175" height="44" rx="6" ry="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" filter="url(#sh)"/><text x="550" y="98.5" text-anchor="middle" font-size="12" class="t-bold" fill="#991b1b">Abort &amp; Show Error</text><text x="550" y="113.5" text-anchor="middle" font-size="10.5" class="t-reg" fill="#475569">Book is out of stock</text><path d="M 550 124 L 550 462 L 330 462" fill="none" stroke="#334155" stroke-width="1.7" marker-end="url(#arr)"/><path d="M 270 134 L 270 160" fill="none" stroke="#15803d" stroke-width="1.7" marker-end="url(#arr-green)"/><rect x="270.8" y="138" width="30.4" height="16" rx="3" fill="#ffffff"/><text x="286" y="150" text-anchor="middle" font-size="10.5" class="t-bold" fill="#15803d">Yes</text><rect x="152.5" y="161.0" width="235" height="42" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" filter="url(#sh)"/><text x="270" y="178.5" text-anchor="middle" font-size="12" class="t-bold" fill="#1e3a8a">UPDATE tbl_books</text><text x="270" y="193.5" text-anchor="middle" font-size="10.5" class="t-reg" fill="#475569">AvailableQty = AvailableQty - 1</text><path d="M 270 203 L 270 226" fill="none" stroke="#334155" stroke-width="1.7" marker-end="url(#arr)"/><rect x="152.5" y="227.0" width="235" height="42" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" filter="url(#sh)"/><text x="270" y="244.5" text-anchor="middle" font-size="12" class="t-bold" fill="#1e3a8a">INSERT into tbl_issuereturn</text><text x="270" y="259.5" text-anchor="middle" font-size="10.5" class="t-reg" fill="#475569">Status = &#x27;Issued&#x27;</text><path d="M 270 269 L 270 294" fill="none" stroke="#334155" stroke-width="1.7" marker-end="url(#arr)"/><polygon points="161.5,295.0 392.5,295.0 378.5,337.0 147.5,337.0" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" filter="url(#sh)"/><text x="270" y="313.0" text-anchor="middle" font-size="11.5" class="t-bold" fill="#14532d">Member Returns Book</text><text x="270" y="327.0" text-anchor="middle" font-size="10.5" class="t-reg" fill="#14532d">Admin Clicks &#x27;Mark Returned&#x27;</text><path d="M 270 337 L 270 362" fill="none" stroke="#334155" stroke-width="1.7" marker-end="url(#arr)"/><rect x="147.5" y="363.0" width="245" height="42" rx="6" ry="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" filter="url(#sh)"/><text x="270" y="380.5" text-anchor="middle" font-size="12" class="t-bold" fill="#14532d">UPDATE tbl_issuereturn</text><text x="270" y="395.5" text-anchor="middle" font-size="10.5" class="t-reg" fill="#475569">Status = &#x27;Returned&#x27;, ReturnDate = NOW()</text><path d="M 270 405 L 270 420" fill="none" stroke="#334155" stroke-width="1.7" marker-end="url(#arr)"/><rect x="147.5" y="420.0" width="245" height="28" rx="6" ry="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" filter="url(#sh)"/><text x="270" y="438.0" text-anchor="middle" font-size="12" class="t-bold" fill="#14532d">Restore: AvailableQty = AvailableQty + 1</text><path d="M 270 448 L 270 456" fill="none" stroke="#334155" stroke-width="1.7" marker-end="url(#arr)"/><rect x="210.0" y="455.0" width="120" height="30" rx="15.0" ry="15.0" fill="#0f172a" stroke="#0f172a" stroke-width="1.8" filter="url(#sh)"/><text x="270" y="474.5" text-anchor="middle" font-size="12.5" class="t-bold" fill="#ffffff">End</text></svg>