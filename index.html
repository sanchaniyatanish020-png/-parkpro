    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "ParkPro",
        "alternateName": "ParkPro Smart Parking Management",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web, Android, iOS",
        "description": "Smart parking management for gate staff and parking owners: QR pass scanning, gate entry/exit records, walk-ins, renewals, reports and offline operation.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" },
        "featureList": [
          "QR pass scanning",
          "Gate entry and exit tracking",
          "Walk-in parking tickets",
          "Pass renewals and reporting",
          "Offline-first operation"
        ]
      }
    </script>
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('parkpro.settings.v1')
          var settings = raw ? JSON.parse(raw) : {}
          var theme = settings.theme && settings.theme !== 'system' ? settings.theme : 'light'
          var dark = theme === 'dark'
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
          if (settings.lang) root.lang = settings.lang === 'en' ? 'en' : settings.lang === 'hi' ? 'hi' : 'gu'
          if (settings.fontScale) root.style.setProperty('--font-scale', String(settings.fontScale))
        } catch (e) {}
      })()
    </script>
